name: Gravar demo (emulador)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk Lume.apk
      - uses: actions/upload-artifact@v4
        with: { name: Lume-apk, path: Lume.apk }

  record:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Lume-apk }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gravar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/demo/record.sh Lume.apk demo-raw.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: demo-raw, path: |
            demo-raw.mp4
            snaps
          if-no-files-found: warn }
      - name: Publicar vídeo bruto em Releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f demo-raw.mp4 ] || exit 0
          gh release delete demo-video --yes --cleanup-tag 2>/dev/null || true
          gh release create demo-video demo-raw.mp4 Lume.apk $(ls snaps/* 2>/dev/null) \
            --title "Vídeo de demonstração (bruto)" \
            --notes "Gravação do emulador, antes da edição." --prerelease
