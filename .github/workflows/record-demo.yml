name: Gravar demo (emulador)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk Lume.apk
      - uses: actions/upload-artifact@v4
        with: { name: Lume-apk, path: Lume.apk }

  record:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Lume-apk }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gravar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/demo/record2.sh Lume.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-raw
          path: |
            clips
            logcat.txt
            snaps
          if-no-files-found: warn
      - name: Publicar clipes em Releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls clips/*.mp4 >/dev/null 2>&1 || exit 0
          gh release delete demo-clips --yes --cleanup-tag 2>/dev/null || true
          gh release create demo-clips clips/*.mp4 $(ls snaps/* 2>/dev/null) logcat.txt \
            --title "Clipes do emulador (brutos)" \
            --notes "Um clipe por cena, antes da edição." --prerelease
