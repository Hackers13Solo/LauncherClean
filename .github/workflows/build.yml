name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Salvar erros do build (branch ci-log)
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed" -A4 build.log | head -200 > /tmp/errors.txt || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ci-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/errors.txt build-errors.txt
          git add build-errors.txt
          git commit -m "erros do build ${{ github.run_number }}" > /dev/null
          git push -f origin ci-log
      - name: Nomear o APK
        run: cp app/build/outputs/apk/release/*.apk Lume.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lume-apk
          path: Lume.apk
      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4-build${{ github.run_number }}"
          gh release create "$TAG" Lume.apk \
            --target "$GITHUB_SHA" \
            --title "Lume $TAG" \
            --notes "APK gerado automaticamente. Baixe o arquivo Lume.apk abaixo, abra no celular e instale." \
            --latest
